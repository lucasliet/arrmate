# Local media lab for Arrmate end-to-end checks.
#
# One process serves four APIs so a grab in Radarr or Sonarr shows up in the
# qBittorrent queue without an external indexer or metadata key.
services:
  media-lab:
    build: ./mock
    image: arrmate-media-lab
    container_name: arrmate-media-lab
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import http.client;
          ports = (7878, 8989, 9696, 8080);
          connections = [http.client.HTTPConnection('127.0.0.1', port, timeout=2) for port in ports];
          [connection.request('GET', '/api/v2/app/version' if port == 8080 else '/ping', headers={'Authorization': 'Bearer arrmate-qbit'}) for port, connection in zip(ports, connections)];
          assert all(connection.getresponse().status == 200 for connection in connections)
      interval: 2s
      timeout: 10s
      retries: 15
    ports:
      - "7878:7878"
      - "8989:8989"
      - "9696:9696"
      - "8080:8080"
