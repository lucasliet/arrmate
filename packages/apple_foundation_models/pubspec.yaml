name: apple_foundation_models
description: >-
  On-device text generation with Apple's Foundation Models framework, the
  system language model behind Apple Intelligence, for iOS and macOS.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.4.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AppleFoundationModelsPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: AppleFoundationModelsPlugin
        sharedDarwinSource: true
