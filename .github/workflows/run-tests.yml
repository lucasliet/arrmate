name: Run Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: 'stable'
          cache: 'true'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate mocks for tests
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Analyze
        run: flutter analyze lib test

      - name: Run Tests
        run: flutter test

      - name: Generate Icons
        run: flutter pub run flutter_launcher_icons

  apple-intelligence-bridge:
    name: Type-check Apple Intelligence bridge
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Type-check against the iOS and macOS deployment targets
        run: |
          BRIDGE=packages/apple_foundation_models/darwin/apple_foundation_models/Sources/apple_foundation_models/FoundationModelsBridge.swift
          for SDK in macosx iphoneos; do
            SDK_PATH=$(xcrun --sdk "$SDK" --show-sdk-path)
            test -d "$SDK_PATH/System/Library/Frameworks/FoundationModels.framework" || {
              echo "::error::The $SDK SDK lacks FoundationModels; select Xcode 26 or later."
              exit 1
            }
          done
          xcrun --sdk macosx swiftc -typecheck -parse-as-library -target arm64-apple-macos10.15 "$BRIDGE"
          xcrun --sdk iphoneos swiftc -typecheck -parse-as-library -target arm64-apple-ios15.0 "$BRIDGE"

  desktop-updater:
    name: Test ${{ matrix.platform }} updater
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify macOS sandbox migration
        if: matrix.platform == 'macos'
        run: |
          swiftc macos/Runner/LegacyPreferencesMigration.swift tool/macos-preferences-test/main.swift -o "$RUNNER_TEMP/macos-preferences-test"
          "$RUNNER_TEMP/macos-preferences-test"
      - name: Verify native replacement and recovery
        run: flutter test test/core/services/desktop_update_service_test.dart
