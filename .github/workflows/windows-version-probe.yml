name: Windows version probe
on:
  push:
    branches:
      - tmp/windows-version-probe
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run the updater test with probe logging
        continue-on-error: true
        run: flutter test test/core/services/desktop_update_service_test.dart --plain-name "native ZIP extraction"
