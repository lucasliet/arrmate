name: Publish Web

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arrmate-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web app
        run: flutter build web --release --base-href /arrmate/

      - name: Add GitHub Pages SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
          include-hidden-files: true

      - name: Upload branch publishing files
        uses: actions/upload-artifact@v4
        with:
          name: arrmate-web-files
          path: build/web
          retention-days: 1
          include-hidden-files: true

  deploy-web:
    name: Deploy Flutter Web
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: arrmate-github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Download web files
        uses: actions/download-artifact@v4
        with:
          name: arrmate-web-files
          path: build/web

      - name: Publish web files to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
