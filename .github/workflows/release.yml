name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example v2.0.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: arrmate-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare-release:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate release tag and resolve source revision
        id: version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release requires a version tag, such as v2.0.0."
            exit 1
          fi
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  generate-notes:
    name: Generate Release Notes
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Build Release Notes Prompt
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then RANGE="HEAD"; else RANGE="$PREV_TAG..HEAD"; fi

          cat > prompt.txt <<'EOF'
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare-release.outputs.tag }}

          CHANGES:
          EOF
          git log "$RANGE" --pretty=format:"%h - %s (%an)" >> prompt.txt
          cat >> prompt.txt <<'EOF'

          TASK: Generate meaningful release notes for this version based on the changes above.

          GUIDELINES:
          - Focus on meaningful changes for final user experience, so ignore technical details like refactor and tests made, etc.
          - Answer everything in brazilian portuguese
          - Start with the title '# ${{ github.repository }} ${{ needs.prepare-release.outputs.tag }}'
          - Write a brief, engaging summary paragraph explaining what this release achieves.
          - Group changes into '## Key Features' (if there are any) and '## Bug Fixes' (if there are any).
          - Use bullet points.
          - Be concise but descriptive.
          - Ignore trivial commits (docs, chores) unless significant.
          - DO NOT USE EMOJIS anywhere in the output. Use standard Markdown only.

          Output ONLY the markdown content.
          EOF

      - name: Generate Release Notes with Claude Haiku
        id: haiku-release-notes
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p --model claude-haiku-4-5 --output-format text --max-turns 4 < prompt.txt > RELEASE_BODY.md
          [ -s RELEASE_BODY.md ]

      - name: Generate Release Notes with Z.AI (fallback)
        if: steps.haiku-release-notes.outcome == 'failure'
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_API_KEY }}
          CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_ENFORCEMENT: "1"
        run: claude -p --model glm-4.5-air --output-format text --max-turns 4 < prompt.txt > RELEASE_BODY.md

      - name: Fallback on empty or failed output
        run: |
          if [ ! -s RELEASE_BODY.md ] || grep -qE 'Reached max turns|API Error|Failed to authenticate' RELEASE_BODY.md; then
            git log -1 --pretty=%B > RELEASE_BODY.md
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_BODY.md
          if-no-files-found: error
          retention-days: 7

  build-applications:
    name: Build Applications
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
    outputs:
      run_id: ${{ steps.dispatch.outputs.run_id }}
    steps:
      - name: Dispatch platform builds on main
        id: dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const releaseTag = '${{ needs.prepare-release.outputs.tag }}';
            const checkoutRef = '${{ needs.prepare-release.outputs.commit }}';
            const requestId = String(context.runId);
            const expectedName = `Build Applications ${releaseTag} ${requestId}`;

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main',
              inputs: {
                release_tag: releaseTag,
                checkout_ref: checkoutRef,
                request_id: requestId,
              },
            });

            const pause = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            const startDeadline = Date.now() + 5 * 60 * 1000;
            let buildRun;
            while (!buildRun && Date.now() < startDeadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'build.yml',
                branch: 'main',
                event: 'workflow_dispatch',
                per_page: 100,
              });
              buildRun = data.workflow_runs.find(run => run.display_title === expectedName);
              if (!buildRun) await pause(10000);
            }
            if (!buildRun) {
              throw new Error(`Build workflow did not start: ${expectedName}`);
            }

            core.info(`Waiting for platform build run ${buildRun.html_url}`);
            const completionDeadline = Date.now() + 105 * 60 * 1000;
            while (buildRun.status !== 'completed' && Date.now() < completionDeadline) {
              await pause(15000);
              const { data } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: buildRun.id,
              });
              buildRun = data;
            }
            if (buildRun.status !== 'completed') {
              throw new Error(`Platform build timed out: ${buildRun.html_url}`);
            }
            if (buildRun.conclusion !== 'success') {
              throw new Error(`Platform build concluded ${buildRun.conclusion}: ${buildRun.html_url}`);
            }
            core.setOutput('run_id', String(buildRun.id));
            core.info(`All platform builds succeeded: ${buildRun.html_url}`);

  publish-release:
    name: Publish Release
    needs: [prepare-release, generate-notes, build-applications]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
          run-id: ${{ needs.build-applications.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate AltStore source
        run: |
          python3 - <<'EOF'
          import datetime
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          ipa_size = Path("dist/arrmate.ipa").stat().st_size
          release_notes = Path("dist/RELEASE_BODY.md").read_text()

          source = {
              "name": "Arrmate",
              "identifier": "br.com.lucasliet.arrmate.source",
              "sourceURL": "https://github.com/lucasliet/arrmate/releases/latest/download/altstore.json",
              "subtitle": "Native companion for your self-hosted media servers",
              "description": "Official AltStore Source for Arrmate, a native companion for self-hosted media servers. Manage Radarr, Sonarr and qBittorrent from your phone: browse your library, follow release calendars, watch downloads in real time and import torrents.",
              "website": "https://github.com/lucasliet/arrmate",
              "featuredApps": ["br.com.lucasliet.arrmate"],
              "apps": [
                  {
                      "bundleIdentifier": "br.com.lucasliet.arrmate",
                      "name": "Arrmate",
                      "developerName": "Lucas Oliveira",
                      "subtitle": "Companion app for Radarr, Sonarr and qBittorrent",
                      "localizedDescription": "Native mobile companion for self-hosted media servers. Browse and manage your Radarr, Sonarr and qBittorrent instances, track downloads, follow release calendars and receive push notifications.",
                      "iconURL": "https://raw.githubusercontent.com/lucasliet/arrmate/main/assets/images/icon.png",
                      "tintColor": "2196F3",
                      "category": "entertainment",
                      "screenshots": [
                          {
                              "imageURL": "https://raw.githubusercontent.com/lucasliet/arrmate/main/assets/screenshots/movies.png",
                              "width": 750,
                              "height": 1630
                          },
                          {
                              "imageURL": "https://raw.githubusercontent.com/lucasliet/arrmate/main/assets/screenshots/series_details.png",
                              "width": 750,
                              "height": 1630
                          },
                          {
                              "imageURL": "https://raw.githubusercontent.com/lucasliet/arrmate/main/assets/screenshots/calendar.png",
                              "width": 750,
                              "height": 1630
                          }
                      ],
                      "versions": [
                          {
                              "version": tag.lstrip("v"),
                              "buildVersion": os.environ["GITHUB_RUN_NUMBER"],
                              "date": datetime.date.today().isoformat(),
                              "localizedDescription": release_notes,
                              "downloadURL": "https://github.com/lucasliet/arrmate/releases/download/" + tag + "/arrmate.ipa",
                              "size": ipa_size,
                              "minOSVersion": "15.0",
                          }
                      ],
                  }
              ],
              "news": [],
          }


          Path("dist/altstore.json").write_text(json.dumps(source, indent=2))
          EOF

      - name: Require every platform artifact
        run: |
          for ASSET in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk \
            arrmate.ipa arrmate-windows-x64.zip arrmate-linux-x64.AppImage \
            arrmate-macos.zip altstore.json; do
            test -s "dist/$ASSET" || { echo "::error::Missing release artifact: $ASSET"; exit 1; }
          done

      - name: Add installation instructions
        run: |
          cat >> dist/RELEASE_BODY.md <<'EOF'

          ---
          ## Instalação

          - Android: instale o APK correspondente à arquitetura do aparelho.
          - iOS: instale o `arrmate.ipa` usando AltStore ou Sideloadly.
          - AltStore source: https://github.com/lucasliet/arrmate/releases/latest/download/altstore.json
          - Windows: extraia `arrmate-windows-x64.zip` e execute `arrmate.exe`.
          - Linux: dê permissão de execução ao `arrmate-linux-x64.AppImage` (`chmod +x`) e abra o arquivo. Sem FUSE, use `--appimage-extract-and-run`.
          - macOS: extraia `arrmate-macos.zip` e abra `Arrmate.app`.
          EOF

      - name: Publish all platforms together
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/app-arm64-v8a-release.apk,dist/app-armeabi-v7a-release.apk,dist/arrmate.ipa,dist/altstore.json,dist/arrmate-windows-x64.zip,dist/arrmate-linux-x64.AppImage,dist/arrmate-macos.zip
          tag: ${{ needs.prepare-release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          bodyFile: dist/RELEASE_BODY.md
